# flow-shop in a throwaway Docker container, agent-only, starting as a verified logged-in test account.
# NOT APPROVED on purpose: approving a contract is a human decision. Review it, then run
#   sentri contract approve examples/flow-shop/contract.docker.yaml --as "<your name>" --out examples/flow-shop/approved.docker.yaml
# (approved.docker.yaml is git-ignored). Same as contract.agent.authed.yaml except app.docker replaces app.run.
# A neutral test precondition: it does not show that an agent can log in by itself. Same as contract.agent.yaml otherwise.
# flow-shop, agent-only validation contract. Deliberately minimal and neutral:
# how Sentri starts the app, how a test identity logs in (setup: fresh generated accounts, nothing stored),
# and one plain goal. No baseline flows, no routes, no hints. The agent must find its way from what it sees.
version: 1

app:
  docker: {context: ".", dockerfile: "Dockerfile", container_port: 5088}
  port: 5088
  base_url: "http://127.0.0.1:5088"
  startup_timeout_s: 180
  health_path: "/"
  reset: restart            # state is in memory only: each attempt and replay starts from a fresh process

auth:
  login_flow: login
  start_as: a             # exploration begins logged in as test account a, verified against a login-only page

goals:
  - "Complete a purchase"

flows:
  - id: login
    attack: false
    start: "/signup"
    steps:
      - fill: {selector: "input[name=email]", value: "{email}"}
      - fill: {selector: "input[name=password]", value: "{password}"}
      - click: "#signup-btn"
      - wait_for: {selector: "#login-btn"}
      - fill: {selector: "input[name=email]", value: "{email}"}
      - fill: {selector: "input[name=password]", value: "{password}"}
      - click: "#login-btn"
    success: {text_visible: "Shop"}
