[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sentri"
version = "0.1.0"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
description = "Attacks a running web app like a hostile user; plain code decides pass or fail."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.12.0",
  "playwright>=1.65.2",
  "pydantic>=2.14.4",
  "pyyaml>=6.0.4",
  "typer>=0.29.2",
  "docker>=7.2.0",
  "fastapi>=0.165.0",
  "uvicorn>=0.54.0",
  "rich>=15.0.0",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.6",
  "mypy>=2.4.1",
  "types-PyYAML>=6.0.12.20261113",
  "httpx>=0.28.1",
  "flask>=3.1.3",
]

[project.scripts]
sentri = "sentri.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs Chromium and the buggy example app",
  "docker: needs a running Docker daemon",
  "live_llm: calls the real model API",
]
addopts = "-m 'not integration and not docker and not live_llm'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "ASYNC240"]  # ASYNC240: tiny local file checks in a local tool are fine

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sentri.verdict.*"]
strict = true
