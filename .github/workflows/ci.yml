name: CI
# Runs on every push to main, and on demand (Actions tab > CI > Run workflow, or `gh workflow run CI`).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: lint, types, unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: mypy src
      - run: pytest

  e2e:
    name: end to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: sentri setup ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - name: demo app starts
        shell: bash
        working-directory: examples/buggy-app
        run: |
          PORT=5099 PYTHONUNBUFFERED=1 python app.py > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5099/ && break; sleep 1; done
          cat app.log
          curl -sf -o /dev/null http://127.0.0.1:5099/ && echo "demo app answered after ${i}s"
          kill %1 || true
      - run: python scripts/smoke_test.py
        env:
          CI: "1"
      - run: pytest -m integration tests/integration -v --durations=0
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-evidence-${{ matrix.os }}
          path: |
            evidence/
            ${{ runner.temp }}/sentri-*/
          if-no-files-found: ignore

  docker:
    name: docker sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: sentri setup --with-deps
      - run: sentri contract approve examples/buggy-app/contract.docker.yaml --as ci --out examples/buggy-app/contract.docker.yaml
      - run: >
          sentri run --contract examples/buggy-app/contract.docker.yaml --no-llm
          --only signup:empty_input --only create_task:bad_file --out report.md
      - run: cat report.md

  action-local-model:
    name: action with a local model (Ollama, no API key)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "flask>=3.1.3" .  # the demo app's dependency, and sentri to approve the contract
      - run: sentri contract approve examples/buggy-app/contract.yaml --as ci --out examples/buggy-app/contract.yaml
      - id: sentri
        uses: ./
        with:
          sentri-source: "."
          contract: examples/buggy-app/contract.yaml
          ollama-model: qwen2.5:0.5b
          extra-args: --only signup:empty_input --only create_task:bad_file
      - name: the run finished and actually called the local model
        shell: bash
        run: |
          test "${{ steps.sentri.outputs.exit-code }}" = "0"
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect(".sentri/ledger.db")
          run = db.execute("SELECT id, status, llm_mode FROM runs ORDER BY id DESC LIMIT 1").fetchone()
          print("run:", run)
          assert run[1] == "finished", run
          errors = [r[0] for r in db.execute("SELECT data FROM events WHERE kind='llm_fallback'")]
          print("fallbacks:", errors)
          # The model was reached if any payload came from it, or if it answered but was rejected by validation.
          reached = run[2] in ("llm", "mixed") or any("connection error" not in e and "unavailable" not in e for e in errors)
          assert reached, "the local model was never called"
          PY
